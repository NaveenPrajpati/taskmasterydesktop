# Builds (output in release/):
#   npm run dist        Windows installer → TaskMastery-Setup-<version>.exe
#   npm run release     the same, uploaded to GitHub Releases (auto-update)
#   npm run dist:store  Microsoft Store package → TaskMastery-Store-<version>.appx
#   npm run dist:mac    macOS → .dmg + .zip (only on a Mac)
appId: com.taskmastery.desktop
productName: TaskMastery
copyright: Copyright © 2026 TaskMastery

directories:
  output: release
  buildResources: assets

files:
  - dist/**/*
  - "!dist/**/*.map"
  - static/**/*
  - assets/icon.png
  - app.config.json
  - package.json

# taskmastery:// links (browser sign-in hands the session back with one)
protocols:
  - name: TaskMastery
    schemes:
      - taskmastery

win:
  target:
    - nsis
  icon: assets/icon.png
  artifactName: TaskMastery-Setup-${version}.${ext}
  # Code signing (removes the SmartScreen "unknown publisher" warning), e.g.
  # Azure Trusted Signing - see README.md
  # azureSignOptions:
  #   publisherName: ...
  #   endpoint: https://<region>.codesigning.azure.net
  #   codeSigningAccountName: ...
  #   certificateProfileName: ...

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: TaskMastery

# Microsoft Store. Copy the three identity values from Partner Center → your
# app → Product management → Product identity. The Store signs the package
# and delivers updates (the app skips its own updater there).
appx:
  identityName: TaskMastery.PLACEHOLDER # Package/Identity/Name
  publisher: CN=00000000-0000-0000-0000-000000000000 # Package/Identity/Publisher
  publisherDisplayName: TaskMastery # Package/Properties/PublisherDisplayName
  displayName: TaskMastery
  applicationId: TaskMastery
  backgroundColor: transparent
  languages:
    - en-US
  # No auto-start on install; tile images: assets/appx (npm run store-assets)
  addAutoLaunchExtension: false
  artifactName: TaskMastery-Store-${version}.${ext}

# macOS (build on a Mac). Signing + notarization need an Apple Developer
# account; see README.md.
mac:
  target:
    - dmg
    - zip # electron-updater updates from the zip
  category: public.app-category.productivity
  icon: assets/icon.png
  hardenedRuntime: true
  entitlements: assets/entitlements.mac.plist
  entitlementsInherit: assets/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: TaskMastery uses your microphone for calls.

dmg:
  artifactName: TaskMastery-${version}.${ext}

publish:
  provider: github
  owner: NaveenPrajpati
  repo: taskMasteryDesktop
  releaseType: release
