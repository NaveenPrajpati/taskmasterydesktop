# Builds (output in release/):
#   npm run dist        Windows installer → Tazor-Setup-<version>.exe
#   npm run release     the same, uploaded to GitHub Releases (auto-update)
#   npm run dist:store  Microsoft Store package → Tazor-Store-<version>.appx
#   npm run dist:mac    macOS → .dmg + .zip (only on a Mac)
appId: com.taskmastery.desktop
productName: Tazor
copyright: Copyright © 2026 Tazor

directories:
  output: release
  buildResources: assets

files:
  - dist/**/*
  - "!dist/**/*.map"
  - static/**/*
  - assets/icon.png
  - app.config.json
  - package.json

# taskmastery:// links (browser sign-in hands the session back with one)
protocols:
  - name: Tazor
    schemes:
      - taskmastery

win:
  target:
    - nsis
  icon: assets/icon.png
  artifactName: Tazor-Setup-${version}.${ext}
  # Code signing (removes the SmartScreen "unknown publisher" warning), e.g.
  # Azure Trusted Signing - see README.md
  # azureSignOptions:
  #   publisherName: ...
  #   endpoint: https://<region>.codesigning.azure.net
  #   codeSigningAccountName: ...
  #   certificateProfileName: ...

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Tazor

# Microsoft Store. Copy the three identity values from Partner Center → your
# app → Product management → Product identity. The Store signs the package
# and delivers updates (the app skips its own updater there).
appx:
  identityName: solidauto.Tazor # Package/Identity/Name
  publisher: CN=EA07AA91-53F2-4C88-9717-231C9502E6EF # Package/Identity/Publisher
  publisherDisplayName: solidauto #Package/Properties/PublisherDisplayName
  displayName: Tazor
  applicationId: tazor
  backgroundColor: transparent
  languages:
    - en-US
  # No auto-start on install; tile images: assets/appx (npm run store-assets)
  addAutoLaunchExtension: false
  artifactName: Tazor-Store-${version}.${ext}

# macOS (build on a Mac). Signing + notarization need an Apple Developer
# account; see README.md.
mac:
  target:
    - dmg
    - zip # electron-updater updates from the zip
  category: public.app-category.productivity
  icon: assets/icon-mac.png # Apple's icon grid: tile with margins
  hardenedRuntime: true
  entitlements: assets/entitlements.mac.plist
  entitlementsInherit: assets/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: Tazor uses your microphone for calls.

dmg:
  artifactName: Tazor-${version}.${ext}

publish:
  provider: github
  owner: NaveenPrajpati
  repo: taskMasteryDesktop
  releaseType: release
